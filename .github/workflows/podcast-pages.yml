name: Refresh podcast and publish Pages

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: podcast-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check archive and channel rules
        run: node --test scripts/refresh-podcast.test.mjs
      - name: Refresh public podcast archive
        run: node scripts/refresh-podcast.mjs
      - name: Save archive for the next refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast-episodes.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh podcast archive"
            git push
          fi
      # GITHUB_TOKEN commits do not trigger another Pages build.
      # Always deploy the updated working tree in this same run.
      - uses: actions/configure-pages@v5
      - name: Stage browser files only
        run: |
          mkdir _site
          cp index.html .nojekyll podcast-episodes.json _site/
          cp -r assets _site/
          find . -maxdepth 1 -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.svg' -o -name '*.txt' -o -name 'CNAME' \) -exec cp {} _site/ \;
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
